repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0  # Usa la versión estable que prefieras
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0  # Ajusta según lo necesites
    hooks:
      - id: isort
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0  # Versión anterior más estable
    hooks:
      - id: flake8
        language_version: python3
